name: junggae-mate

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mate}
      POSTGRES_DB: mate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mate -d mate"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mate:${POSTGRES_PASSWORD:-mate}@db:5432/mate
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - rawdocs:/data/raw
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rawdocs:
