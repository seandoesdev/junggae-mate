<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>중개메이트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>

    <div id="app" hidden>
      <header class="topbar">
        <a class="brand" href="#/map"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#1b6c80"/><path d="M5 8.5 11 5l8 3.2-1.6 8.8L9 19l-4-3.4z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 5l-1 7.2 7.4 4.8M10 12.2 5 16.6" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".55"/><circle cx="10" cy="12.2" r="1.8" fill="#fff"/></svg><span>중개메이트</span><span class="office" id="office-name"></span></a>
        <nav class="nav" aria-label="주요 메뉴">
          <div class="nav-host">
            <a href="#/ai" data-nav="ai" aria-haspopup="true"><svg class="nav-spark" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 5.2 5.1 1.9-5.1 1.9L12 17.7l-1.9-5.2L5 10.6l5.1-1.9z"/></svg>Hood AI<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></a>
            <div class="nav-menu" role="menu" aria-label="Hood AI">
              <a role="menuitem" href="#/ai/reports"><b>보고서</b><span>Hood AI 답변으로 만든 고객 자료</span></a>
              <a role="menuitem" href="#/ai/usage"><b>사용량</b><span>질문 수, 사람별, 쓴 자료</span></a>
              <a role="menuitem" href="#/ai/settings"><b>설정</b><span>답변에 쓸 자료와 방식</span></a>
            </div>
          </div>
          <a href="#/map" data-nav="map">지도</a>
          <a href="#/deals" data-nav="deals">거래</a>
          <a href="#/customers" data-nav="customers">고객</a>
          <a href="#/library" data-nav="library">자료실</a>
          <a href="#/public" data-nav="public" data-admin hidden>공공데이터</a>
        </nav>
        <span class="me">
          <button type="button" class="ask-hood" id="ask-hood-btn" data-act="hood-toggle" aria-controls="hood-panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 5.2 5.1 1.9-5.1 1.9L12 17.7l-1.9-5.2L5 10.6l5.1-1.9z"/></svg><span>Ask Hood</span></button>
          <span class="who-name" id="me-name"></span><button type="button" class="logout" data-act="logout">로그아웃</button></span>
      </header>

      <main id="view-map" class="view view-map" hidden>
        <aside class="side" id="map-side" aria-label="매물 목록과 상세"></aside>
        <section class="map-wrap" aria-label="매물 지도">
          <div class="map-bar">
            <div class="toggle" role="group" aria-label="보기 범위">
              <button type="button" data-scope="mine" aria-pressed="true">내 매물</button>
              <button type="button" data-scope="all" aria-pressed="false">사무소 전체</button>
            </div>
            <div class="stage-filter" id="stage-filter" role="group" aria-label="거래 단계 필터"></div>
          </div>
          <div class="match-bar" id="match-bar" hidden></div>
          <div class="pick-bar" id="pick-bar" hidden>지도를 눌러 매물 위치를 정하세요. 표시를 끌어서 옮길 수 있습니다.</div>
          <div id="map" class="map"></div>
          <p class="map-fail" id="map-fail" hidden>지도를 불러오지 못했습니다. 왼쪽 목록을 이용하세요.</p>
        </section>
      </main>

      <main id="view-deals" class="view view-page" hidden>
        <div class="page-head">
          <h1>거래</h1>
          <div class="toggle" role="group" aria-label="보기 범위">
            <button type="button" data-scope="mine" aria-pressed="true">내 거래</button>
            <button type="button" data-scope="all" aria-pressed="false">사무소 전체</button>
          </div>
        </div>
        <div class="board" id="board"></div>
        <p class="dropped" id="dropped"></p>
      </main>

      <main id="view-customers" class="view view-split" hidden>
        <aside class="side" id="customer-list" aria-label="고객 목록"></aside>
        <section class="pane" id="customer-detail"></section>
      </main>

      <main id="view-library" class="view view-split" hidden>
        <aside class="side" id="library-side" aria-label="자료 검색"></aside>
        <section class="pane" id="library-detail"></section>
      </main>

      <main id="view-ai" class="view view-ai" hidden>
        <aside class="ai-rail" aria-label="Hood AI 메뉴와 이전 대화">
          <nav class="ai-nav" aria-label="Hood AI">
            <a href="#/ai" data-ai="search">채팅</a>
            <a href="#/ai/reports" data-ai="reports">보고서</a>
            <a href="#/ai/usage" data-ai="usage">사용량</a>
            <a href="#/ai/settings" data-ai="settings">설정</a>
          </nav>
          <div class="ai-history-h"><h2>이전 대화</h2><a class="btn btn--sm" href="#/ai" data-act="hood-new-page">새 대화</a></div>
          <ul class="ai-history" id="ai-history"></ul>
        </aside>
        <section class="ai-main" id="ai-main"></section>
      </main>

      <main id="view-public" class="view view-page public-admin" hidden></main>

      <main id="view-report" class="view view-report" hidden></main>
    </div>

    <!-- 로그인 (앱 화면 뒤에 둔다: 화면 제목 h1이 문서에서 먼저 나오도록) -->
    <main id="login-screen" class="login">
      <form id="login-form" class="login-box" novalidate>
        <h1><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#1b6c80"/><path d="M5 8.5 11 5l8 3.2-1.6 8.8L9 19l-4-3.4z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 5l-1 7.2 7.4 4.8M10 12.2 5 16.6" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".55"/><circle cx="10" cy="12.2" r="1.8" fill="#fff"/></svg>중개메이트</h1>
        <label>이메일<input id="login-email" type="email" autocomplete="username" value="agent@hanul.test" required /></label>
        <label>비밀번호<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button id="login-btn" type="submit" class="btn btn--main">로그인</button>
        <p class="login-hint">예시 계정: agent@hanul.test / demo1234 (같은 사무소: park@, lee@, admin@hanul.test)</p>
      </form>
    </main>

    <!-- Ask Hood: 어느 화면에서든 오른쪽에서 바로 묻는 패널. 시계로 이전 대화를 불러온다 -->
    <aside class="hood-panel" id="hood-panel" aria-label="Ask Hood" aria-hidden="true">
      <header class="hood-h">
        <h2 class="hood-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.9 5.2 5.1 1.9-5.1 1.9L12 17.7l-1.9-5.2L5 10.6l5.1-1.9z"/></svg><span>Ask Hood</span></h2>
        <span class="hood-tools">
          <button type="button" class="icon-btn" data-act="hood-history" aria-label="이전 대화" title="이전 대화"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
          <button type="button" class="icon-btn" data-act="hood-new" aria-label="새 대화" title="새 대화"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <a class="icon-btn" id="hood-expand" href="#/ai" aria-label="Hood AI에서 크게 보기" title="크게 보기"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></a>
          <button type="button" class="icon-btn" data-act="hood-close" aria-label="닫기" title="닫기"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </span>
      </header>
      <div class="hood-body" id="hood-body"></div>
      <form class="composer composer--panel" id="hood-form" autocomplete="off">
        <textarea id="hood-q" rows="2" maxlength="500" aria-label="Hood에게 질문" placeholder="질문하거나 이어서 물어보세요"></textarea>
        <div class="composer-bar">
          <button type="button" class="icon-btn" data-act="add-doc" aria-label="자료 추가 (Hood가 근거로 쓸 사무소 자료)" title="자료 추가"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20.5 11.5-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button>
          <label class="composer-toggle"><input type="checkbox" name="news" checked /><span class="track" aria-hidden="true"></span>기사 포함</label>
          <button type="submit" class="composer-send" aria-label="보내기"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </form>
    </aside>

    <aside class="drawer" id="drawer" aria-label="출처" hidden></aside>
    <dialog id="dialog" class="dialog"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app-core.js"></script>
    <script src="app-map.js"></script>
    <script src="app-ask.js"></script>
    <script src="app-hood.js"></script>
    <script src="app-people.js"></script>
    <script src="app-docs.js"></script>
    <script src="app-public.js"></script>
  </body>
</html>
