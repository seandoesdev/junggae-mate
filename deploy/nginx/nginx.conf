# API 서버 앞단 nginx — 443으로 받아 app:8000으로 넘긴다.
# 443 하나로 Let's Encrypt까지 처리한다:
#   stream(443): TLS를 풀지 않고 ALPN만 본다
#     - acme-tls/1 (Let's Encrypt TLS-ALPN-01 확인) → acme 컨테이너(acme.sh, 10443)
#     - 그 밖의 모든 연결                          → 아래 http 서버(127.0.0.1:8443)
#   http(127.0.0.1:8443): 인증서로 TLS를 풀고 app:8000으로 프록시
# 인증서는 acme 컨테이너가 /certs 에 넣고, 바뀌면 90-reload-on-cert-change.sh가 nginx를 다시 읽힌다.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    map $ssl_preread_alpn_protocols $tls_upstream {
        ~\bacme-tls/1\b  acme_alpn;
        default          https_local;
    }

    upstream acme_alpn   { server acme:10443; }
    upstream https_local { server 127.0.0.1:8443; }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $tls_upstream;
        proxy_connect_timeout 5s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    log_format  main  '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    server {
        # 바깥은 위 stream이 받는다. 여기는 컨테이너 안에서만 열린다
        listen 127.0.0.1:8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 문서·PDF 등록(업로드)을 위해
        client_max_body_size 30m;

        location / {
            proxy_pass http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;   # Hood AI 답변·공공데이터 수집이 오래 걸릴 수 있다
        }
    }
}
